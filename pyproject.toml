[project]
name = "aptus-r"
version = "0.1.0"
description = "Intelligent candidate ranking for Redrob Track 1 (Team Code Blooded)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Mahakisore" },
  { name = "Jaswanth Saravanan" },
  { name = "RamKumar KR" },
]

# Runtime deps — needed by the timed Phase B ranking step (lean, offline, CPU).
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "faiss-cpu==1.8.0",
  "rank-bm25==0.2.2",
  "llama-cpp-python==0.2.79",
  "pyyaml==6.0.1",
  "orjson==3.10.6",
  "scikit-learn==1.5.1",
  "structlog==24.2.0",
]

[project.optional-dependencies]
# Phase-A-only / heavy deps NOT needed in the timed Phase B ranking step.
# The timed `aptus-rank` path never imports these (it reads precomputed embeddings).
precompute = [
  "sentence-transformers==3.0.1",
  "torch==2.3.1",
  "transformers==4.42.4",
]
sandbox = ["streamlit==1.36.0"]

[dependency-groups]
dev = [
  "ruff==0.5.5",
  "mypy==1.11.1",
  "types-pyyaml==6.0.12.20240917",
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "pre-commit==3.7.1",
  "nbstripout==0.7.1",
]

[project.scripts]
aptus-precompute = "aptus.cli.precompute:main"
aptus-rank = "aptus.cli.rank:main"
aptus-eval = "aptus.cli.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: the importable package lives at src/aptus
packages = ["src/aptus"]

# ============================================================================
# Lint + format — ruff (replaces flake8/isort/black). See docs/07 §3.
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored third-party (kept byte-for-byte) + the organizer data bundle are not ours to lint.
extend-exclude = ["validate_submission.py", "[[]PUB[]]*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN101", "ANN102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

# ============================================================================
# Types — mypy --strict on src/aptus. See docs/07 §4.
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = [
  "faiss.*",
  "rank_bm25.*",
  "llama_cpp.*",
  "sentence_transformers.*",
  "pandas.*",
  "pyarrow.*",
  "structlog.*",
]
ignore_missing_imports = true

# ============================================================================
# Tests + coverage — pytest. See docs/07 §8.
# ============================================================================
[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=src/aptus --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
