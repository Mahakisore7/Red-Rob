name: repro
on:
  workflow_dispatch: {}
  push: { tags: ['v*', 'submission-*'] }

# Determinism + reproducibility gate. The full real pipeline needs the ~1.3 GB
# bge model + the GGUF, which are impractical to download per CI run, so this
# exercises the SAME precompute -> rank -> validate code path end-to-end with a
# fake embedder/LLM (test_determinism builds artifacts and ranks twice, asserting
# byte-identical output; test_output runs the validator). Real-model determinism
# is verified locally and recorded in the README / submission_metadata.yaml.
jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --all-extras --dev --frozen
      - name: Determinism + repro (end-to-end, fake embedder/LLM)
        run: uv run pytest tests/test_determinism.py tests/test_output.py tests/test_precompute.py -q
