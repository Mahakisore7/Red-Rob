# concept_thesaurus.yaml — Aptus-R v5
# Maps canonical JD concepts to synonym clusters used in S2 career-arc scoring.
# Purpose: boost role_score for any role whose title/description contains these terms,
# so S2 isn't hostage to one exact wording (docs/04_data_model.md §3.S2).
# Used in Phase A (precompute) to enrich role text before embedding.

