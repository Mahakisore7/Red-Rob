# Phase B (timed, the line above) reads the precomputed artifacts; <5 min, CPU, offline.

# ============================================================================
# Compute environment  (measured on the dev box)
# ============================================================================
compute:
  platform: "Windows 11 laptop (RTX 4050 used for Phase-A embedding only)"
  cpu_cores: 8
  ram_gb: 16
  python_version: "3.11.15"
  os: "Windows 11"
  uses_gpu_for_inference: false        # the timed ranking step is CPU-only
  has_network_during_ranking: false    # rank.py imports no network/embedder libs
  pre_computation_required: true        # embeddings + FAISS + BM25 + features built offline
  pre_computation_time_minutes: 58      # full 100K embed on the RTX 4050 (Phase A)

# ============================================================================
# Models (both local at inference; downloaded once in Phase A)
# ============================================================================
models:
  - "BAAI/bge-large-en-v1.5 (MIT) — embeddings for S1/S2, local"
  - "Phi-3-mini-4k-instruct q4_K_M GGUF (MIT) — top-K rerank + reasoning, local CPU"

# ============================================================================
# Ranking step (measured)
# ============================================================================
ranking_step:
  network_used: false
  wall_clock_sec_non_llm: 3        # safety submission (composite only)
  wall_clock_sec_with_llm: 207     # composite + Phi-3 rerank of the top-K
  ram_peak_gb: 5                   # FAISS memmap + BM25 + parquet + GGUF
  deterministic: true              # byte-identical CSV across runs (verified)
  honeypots_in_top_100: 0

llm_blend_weight: 0.70   # provisional (Decision Rule 1 inconclusive on weak labels; see eval/)

# ============================================================================
# Offline precompute declaration
# ============================================================================
offline_precompute:
  declared: true
  steps: [parse, skill_index, honeypot_gate, text_build, bge-large_embed, FAISS, BM25, features, facts, jd_embedding]
  network_used: true   # Phase A only (one-time model download)
artifacts_rebuilt: [faiss.index, bm25.pkl, candidate_features.parquet, candidate_facts.parquet, id_map.json, honeypot_ids.json, jd_embedding.npy]

