# ============================================================================
# Approach + declarations
# ============================================================================
methodology_summary: |
  Dual retrieval (FAISS dense + BM25 lexical) fused by Reciprocal Rank Fusion into a
  ~500 pool, scored by a 5-signal composite (semantic, career-arc, behavioral, recency,
  intent) with multiplicative JD modifiers and disqualifier penalties; honeypots are
  gated and crushed x0.05. The top-K are reranked by a local Phi-3-mini (deterministic,
  adaptive time gate) and blended; reasoning is grounded against the record. Every weight
  is config-driven and traced to the JD; the eval harness (NDCG/MAP/P@10) shows the
  composite beats the naive baseline decisively.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true        # 6-rule gate + x0.05 + terminal assertion (0 in top-100)
  reproduction_tested: true
